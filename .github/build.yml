name: Build VST3

on:
  push:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar tests del DSP
        run: cmake --build build --config Release --target dsp_test

      - name: Ejecutar tests del DSP
        run: ./build/Release/dsp_test.exe

      - name: Compilar el VST3
        run: cmake --build build --config Release --target OneChain_VST3 --parallel

      - name: Subir el plugin como descarga
        uses: actions/upload-artifact@v4
        with:
          name: OneChain-VST3
          path: build/OneChain_artefacts/Release/VST3/
